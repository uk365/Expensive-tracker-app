name: expensive_tracker_app
description: "A production-grade freelance finance tracker — income, expenses, clients, and worktree."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI
  flex_color_scheme: ^8.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  shimmer: ^3.0.0

  # Forms & Validation
  reactive_forms: ^17.0.0

  # Utilities
  intl: ^0.20.2
  json_annotation: ^4.9.0
  uuid: ^4.5.1

  # Icons & UI extras
  cupertino_icons: ^1.0.8

  # URL launching
  url_launcher: ^6.3.0

  # Storage
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5

  # Secure Storage
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
